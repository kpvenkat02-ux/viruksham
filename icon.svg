<!--
  Prism — the M monogram with its rising arrow.

  Matches the header mark rather than restating the site's abstract theme: the
  tab icon and the logo a visitor just looked at should be the same thing.

  Drawn as strokes, not a scaled-down copy of the artwork. The mark is a
  gradient-shaded 3D M, and a gradient averages to one muddy colour by the
  time it is 16px wide — which is the size that decides whether a favicon
  works. Two flat strokes stay legible there.

  The gold arrow is the one detail kept from the mark, because it is what
  distinguishes this M from any other. It sweeps under the letter and lifts
  clear of it on the right, so at small sizes it still reads as movement
  rather than as a smudge against the stem.

  The tile is the site's indigo rather than its page ground: a favicon sits
  against the browser's own chrome, usually light, so a near-white tile would
  disappear into it.

  Colours are the site's own — navy, navy-deep and gold. Keep them in step
  with `theme` in src/site/content.ts.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#012F6A"/>
      <stop offset="0.55" stop-color="#012F6A"/>
      <stop offset="1" stop-color="#151864"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="12" fill="url(#p)"/>
  <!-- the M, sat high enough to leave the arrow its own clear band below -->
  <path d="M10 24.5V11l10 8 10-8v13.5" fill="none" stroke="#ffffff"
        stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- the swoosh: under the letter, lifting clear on the right. Both strokes
       are thickened and pushed apart so that at 16px, where each is barely
       one pixel, they stay two marks instead of merging into one smudge. -->
  <path d="M7.5 31.5c7.8 3.4 16.8 2 23-5" fill="none" stroke="#f7c835"
        stroke-width="3.2" stroke-linecap="round"/>
  <path d="M27 25.4l4.8 0.4-1 4.8" fill="none" stroke="#f7c835"
        stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
